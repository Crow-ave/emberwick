[package]
name = "emberwick-village-ledger"
version = "1.0.0"
edition = "2021"
description = "Emberwick Village Ledger: an append-only record of the village's daily state hashes and NEAR AI plan hashes"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
