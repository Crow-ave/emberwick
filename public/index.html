<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberwick — a living village economy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="ember"></span>Emberwick</div>
    <div class="stat" id="day">Day 1</div>
    <div class="stat muted" id="day-left"></div>
    <button class="ffbtn" id="ff-btn" type="button"></button>
    <div class="stat muted" id="pop"></div>
    <button class="helptop" id="howto-btn" type="button" data-howto="1" data-i18n="how.btn">How to play</button>
    <button class="helptop tourbtn" id="tour-btn" type="button" data-tour="0" data-i18n="tour.btn">Judge tour</button>
    <select id="lang" class="lang"></select>
    <button class="sndbtn" id="sfx-btn" type="button"></button><button class="sndbtn" id="music-btn" type="button"></button>
    <button id="near-pill" class="near-pill st-off" type="button"><span class="dot"></span><span id="near-text">NEAR</span></button>
    <button id="wallet-btn" class="wallet-btn" type="button" hidden></button>
    <div class="readiness" title="How ready the village is for a dragon attack">
      <span data-i18n="ui.readiness">Dragon readiness</span><div class="bar"><div id="ready-fill"></div></div><span id="ready-num">0%</span>
    </div>
  </header>

  <main class="stage">
    <div class="view" id="view">
      <svg id="map" role="img" aria-label="Map of Emberwick village" preserveAspectRatio="xMidYMid meet"></svg>
      <svg id="scene" role="img" hidden preserveAspectRatio="xMidYMid meet"></svg>
      <button id="mini" class="mini" hidden></button>
      <div id="scene-bar" class="scene-bar" hidden></div>
      <div class="hud-right">
        <div class="card me hud" id="me"></div>
        <div id="scene-menu" class="scene-menu" hidden></div>
        <div id="map-card" class="map-card" hidden></div>
      </div>
      <div class="card quest hud" id="quest" hidden></div>
      <div class="nearbar hud" id="nearbar" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="hint" id="hint" data-i18n="ui.hint"></div>
      <div class="zoom" id="zoom" hidden><button type="button" data-zoom="in" aria-label="+">+</button><button type="button" data-zoom="out" aria-label="−">−</button></div>
    </div>

    <div class="bottom">
      <section class="dock" id="dock"></section>
    </div>

    <aside class="side">
      <div class="card panel" id="panel" hidden></div>
      <section class="card log">
        <div class="logtabs"><button type="button" class="ltab on" data-logtab="news" data-i18n="ui.news">Village news</button><button type="button" class="ltab" data-logtab="chat"><span data-i18n="chat.tab">Chat</span> <span class="unread" id="chat-new" hidden></span></button></div>
        <ul id="log"></ul>
        <div id="chat" hidden>
          <ul id="chat-list"></ul>
          <form id="chat-form" autocomplete="off"><input id="chat-input" maxlength="140" data-i18n-ph="chat.placeholder"><button type="submit" class="primary" data-i18n="chat.send">Send</button></form>
        </div>
      </section>
    </aside>
  </main>

  <div class="overlay" id="join" hidden>
    <form class="dialog" id="join-form" novalidate>
      <h1>Emberwick</h1>
      <p class="story" data-i18n="join.story"></p>
      <div id="join-near"></div>
      <div id="join-signin" class="signin"></div>
      <label for="join-name" data-i18n="join.name">Your name</label>
      <input id="join-name" maxlength="20" placeholder="Your name" data-i18n-ph="join.name" autocomplete="off">
      <div class="error" id="join-error"></div>
      <p class="label" data-i18n="join.who">Who are you?</p>
      <div class="paths" id="paths"></div>
      <button type="submit" class="primary" data-i18n="join.enter">Enter the village</button>
    </form>
  </div>

  <div id="tour" class="tourcard" hidden></div>
  <div class="overlay" id="money" hidden><div class="dialog moneydlg" id="money-box"></div></div>
  <div class="overlay" id="howto" hidden>
    <div class="dialog howto">
      <h2 data-i18n="how.title">How to play Emberwick</h2>
      <p class="muted" data-i18n="how.lead"></p>
      <div class="howgrid">
        <div class="howcard"><div class="howico">⛏</div><h4 data-i18n="how.c1.t"></h4><p data-i18n="how.c1.x"></p></div>
        <div class="howcard"><div class="howico">⚖</div><h4 data-i18n="how.c2.t"></h4><p data-i18n="how.c2.x"></p></div>
        <div class="howcard"><div class="howico">🏠</div><h4 data-i18n="how.c3.t"></h4><p data-i18n="how.c3.x"></p></div>
        <div class="howcard"><div class="howico">🛡</div><h4 data-i18n="how.c4.t"></h4><p data-i18n="how.c4.x"></p></div>
      </div>
      <p class="small muted" data-i18n="how.foot"></p>
      <button class="primary" type="button" id="howto-ok" data-i18n="how.ok">Got it</button>
    </div>
  </div>
  <div class="overlay" id="elder" hidden>
    <div class="dialog elder">
      <div class="elder-row">
        <svg class="elder-face" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="38" fill="#f3e8d6"/><rect x="22" y="48" width="36" height="30" rx="12" fill="#6b5a8a"/><circle cx="40" cy="34" r="15" fill="#f0c8a0"/><path d="M25 32 Q40 14 55 32 Z" fill="#e8e2d6"/><path d="M30 40 Q40 60 50 40 Z" fill="#efe9df"/><circle cx="34" cy="33" r="1.8" fill="#2a2a2a"/><circle cx="46" cy="33" r="1.8" fill="#2a2a2a"/></svg>
        <div>
          <h2 id="elder-title">Elder Rowan</h2>
          <p id="elder-text"></p>
        </div>
      </div>
      <button class="primary" id="elder-ok">I'm ready</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/vendor/near-wallet.js" defer></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
