<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberwick — a living village economy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="ember"></span>Emberwick</div>
    <div class="stat" id="day">Day 1</div>
    <div class="stat muted" id="pop"></div>
    <select id="lang" class="lang"></select>
    <div class="readiness" title="How ready the village is for a dragon attack">
      <span data-i18n="ui.readiness">Dragon readiness</span><div class="bar"><div id="ready-fill"></div></div><span id="ready-num">0%</span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="stage">
    <svg id="map" role="img" aria-label="Map of Emberwick village"></svg>
    <svg id="scene" role="img" hidden></svg>
    <button id="mini" class="mini" hidden></button>
    <div id="scene-bar" class="scene-bar" hidden></div>

    <aside class="side">
      <div class="card me" id="me"></div>
      <div class="card quest" id="quest"></div>
      <div class="card panel" id="panel" hidden></div>
    </aside>

    <div class="hint" id="hint" data-i18n="ui.hint"></div>
  </main>

  <section class="dock" id="dock"></section>

  <section class="log"><h3 data-i18n="ui.news">Village news</h3><ul id="log"></ul></section>

  <div class="overlay" id="join" hidden>
    <form class="dialog" id="join-form" novalidate>
      <h1>Emberwick</h1>
      <p class="story" data-i18n="join.story"></p>
      <label for="join-name" data-i18n="join.name">Your name</label>
      <input id="join-name" maxlength="20" placeholder="Rustem" autocomplete="off">
      <div class="error" id="join-error"></div>
      <p class="label" data-i18n="join.who">Who are you?</p>
      <div class="paths" id="paths"></div>
      <button type="submit" class="primary" data-i18n="join.enter">Enter the village</button>
    </form>
  </div>

  <div class="overlay" id="elder" hidden>
    <div class="dialog elder">
      <div class="elder-row">
        <svg class="elder-face" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="38" fill="#f3e8d6"/><rect x="22" y="48" width="36" height="30" rx="12" fill="#6b5a8a"/><circle cx="40" cy="34" r="15" fill="#f0c8a0"/><path d="M25 32 Q40 14 55 32 Z" fill="#e8e2d6"/><path d="M30 40 Q40 60 50 40 Z" fill="#efe9df"/><circle cx="34" cy="33" r="1.8" fill="#2a2a2a"/><circle cx="46" cy="33" r="1.8" fill="#2a2a2a"/></svg>
        <div>
          <h2 id="elder-title">Elder Rowan</h2>
          <p id="elder-text"></p>
        </div>
      </div>
      <button class="primary" id="elder-ok">I'm ready</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
